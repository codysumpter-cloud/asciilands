name: Glyphbound source checks
on:
  push:
    paths: ['glyphbound/**', '.github/workflows/glyphbound.yml']
  pull_request:
    paths: ['glyphbound/**', '.github/workflows/glyphbound.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundled source and JS syntax
        run: python3 glyphbound/scripts/verify.py